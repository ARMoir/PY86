name: Py86 1.29.0 1KA GC master release (single retained release)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write  # Required to create a release tag and upload the versioned ZIP.

concurrency:
  group: py86-release-master
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/master'
    name: Build, validate, release 1.29.0/1KA-GC and purge older releases
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python on the build runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stamp an increasing release version
        shell: bash
        run: |
          set -euo pipefail
          version="0.$(date -u +'%y.%m').$GITHUB_RUN_NUMBER"
          echo "PY86_VERSION=$version" >> "$GITHUB_ENV"
          echo "PY86_TAG=v$version" >> "$GITHUB_ENV"
          echo "Building Py86 $version"

      - name: Check Py86 build and test script syntax
        shell: bash
        run: |
          python -m py_compile \
            ports/dos16/build.py \
            ports/dos16/prepare_source_129.py \
            ports/dos16/rebase_core_129.py \
            ports/dos16/parser_allocator_lab.py \
            ports/dos16/prepare_release_gc129.py \
            ports/dos16/prepare_repl_autocomplete_129.py \
            tools/py86pkg/gc129_lab.py \
            ports/dos16/package.py \
            ports/dos16/gen_clock.py \
            ports/dos16/run_dos.py \
            ports/dos16/run_vm_fault.py

      - name: Get pinned MicroPython 1.29.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v1.29.0 \
            https://github.com/micropython/micropython.git "$RUNNER_TEMP/micropython-1.29.0"
          actual="$(git -C "$RUNNER_TEMP/micropython-1.29.0" rev-parse HEAD)"
          test "$actual" = "0fd6c573ea815774668bbb16b8e197c8822368b2"

      - name: Install pinned Open Watcom snapshot (Linux x64)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            'https://github.com/open-watcom/open-watcom-v2/releases/download/2026-11-01-Build/ow-snapshot.tar.xz' \
            --output "$RUNNER_TEMP/ow-snapshot.tar.xz"
          mkdir -p "$RUNNER_TEMP/watcom"
          tar -xJf "$RUNNER_TEMP/ow-snapshot.tar.xz" -C "$RUNNER_TEMP/watcom"
          test -x "$RUNNER_TEMP/watcom/binl64/wcc"
          test -x "$RUNNER_TEMP/watcom/binl64/wlink"

      - name: Apply 1.29.0 DOS patches, 1KB parser and validated GC batching
        shell: bash
        run: |
          set -euo pipefail
          python ports/dos16/prepare_source_129.py \
            --source "$RUNNER_TEMP/micropython-1.29.0" \
            --report-dir ports/dos16/build/release129
          python ports/dos16/parser_allocator_lab.py patch-source "$RUNNER_TEMP/micropython-1.29.0"
          python ports/dos16/prepare_release_gc129.py \
            --source "$RUNNER_TEMP/micropython-1.29.0"
          python ports/dos16/prepare_repl_autocomplete_129.py \
            --source "$RUNNER_TEMP/micropython-1.29.0"

      - name: Build qualified MicroPython 1.29.0 1KA + GC for 8086/V20
        shell: bash
        run: |
          set -euo pipefail
          python ports/dos16/build.py \
            --source "$RUNNER_TEMP/micropython-1.29.0" \
            --watcom "$RUNNER_TEMP/watcom" \
            --core-version 1.29.0 \
            --parser-alloc-mode block1024 \
            --compile-opt all \
            --data-layout far128 \
            --runtime-profile \
            --vm-fault-probe
          test -s ports/dos16/build/py86.exe
          grep -q PY86_GC129_APPLIED ports/dos16/build/release-gc-source.txt

      # Use the same pinned portable DOSBox Staging binary that succeeded for
      # py86pkg Roman tests; avoid intermittent Ubuntu apt mirror DNS failures.
      - name: Download pinned DOSBox Staging for runtime tests
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 4 \
            'https://github.com/dosbox-staging/dosbox-staging/releases/download/v0.83.0/dosbox-staging-linux-x86_64-v0.83.0.tar.xz' \
            --output "$RUNNER_TEMP/dosbox-staging.tar.xz"
          echo 'd3a94f7f1c3e68a47ec88d61145506c7904452adb0c9c5928cb8cfe2331d6c5c  '"$RUNNER_TEMP/dosbox-staging.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/dosbox-staging"
          tar -xJf "$RUNNER_TEMP/dosbox-staging.tar.xz" -C "$RUNNER_TEMP/dosbox-staging"
          exe="$(find "$RUNNER_TEMP/dosbox-staging" -type f -name dosbox -print -quit)"
          test -n "$exe"
          chmod +x "$exe"
          echo "DOSBOX_STAGING=$exe" >> "$GITHUB_ENV"
          "$exe" --version

      - name: Run actual Py86 16-bit integration suite in DOSBox Staging
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          python ports/dos16/run_dos.py \
            --dosbox "$DOSBOX_STAGING" --emulator staging --core-version 1.29.0 --timeout 300
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('ports/dos16/build/test-results.json').read_text())
          assert data['version'] == os.environ['PY86_VERSION'], data
          assert data['batch_result'] == 'PASS', data
          print('PASS release version and DOSBox tests:', data['version'])
          PY

      - name: Characterize corrupted VM bytecode in isolated DOSBox processes
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python ports/dos16/run_vm_fault.py \
            --dosbox "$DOSBOX_STAGING" --emulator staging --timeout 35

      - name: Upload count benchmark and VM integrity diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: PY86-count-and-VM-integrity
          retention-days: 30
          if-no-files-found: error
          path: |
            ports/dos16/dos-test/COUNT16.OUT
            ports/dos16/dos-test/ROBUST.OUT
            ports/dos16/dos-test/BADSYNT.OUT
            ports/dos16/build/vm-fault-results.json

      - name: Measure 1.29.0 GC production performance (DOSBox Staging)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python ports/dos16/run_bench.py \
            --dosbox "$DOSBOX_STAGING" --emulator staging \
            --mode production-strings --timeout 240

      - name: Upload production performance measurements
        uses: actions/upload-artifact@v4
        with:
          name: PY86-perf-production
          path: ports/dos16/build/benchmark-production-strings.json
          retention-days: 30

      - name: Upload emulator test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PY86-test-logs
          if-no-files-found: warn
          retention-days: 14
          path: |
            ports/dos16/build/emulator.log
            ports/dos16/build/test-results.json
            ports/dos16/build/vm-fault-results.json
            ports/dos16/build/fault-*.log
            ports/dos16/fault-test/*/*.TXT
            ports/dos16/build/bench-emulator.log
            ports/dos16/bench-test/*.OUT
            ports/dos16/dos-test/*.OUT
            ports/dos16/dos-test/RESULT.TXT
            ports/dos16/dos-test/DEMO.OUT
            ports/dos16/dos-test/SHOW.OUT
            ports/dos16/dos-test/ONECLK.OUT
            ports/dos16/dos-test/PY86.LOG

      - name: Package optimized 1.29.0 1KA-GC release, PythonClock and feature demo
        shell: bash
        run: |
          python ports/dos16/package.py

      # Retain the old Actions artifact name for existing users.
      # Releases publish the standalone ZIP produced by package.py.
      - name: Publish PY86.zip
        uses: actions/upload-artifact@v4
        with:
          name: PY86
          path: ports/dos16/dist/PY86/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Create a versioned, downloadable release ZIP
        shell: bash
        run: |
          set -euo pipefail
          cp ports/dos16/dist/PY86.zip "ports/dos16/dist/PY86-${PY86_VERSION}.zip"
          unzip -t "ports/dos16/dist/PY86-${PY86_VERSION}.zip"
          test -f ports/dos16/dist/PY86/PY86.EXE

      - name: Check this run is still the current master branch head
        id: current_head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq '.commit.sha')"
          if [ "$actual" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release from obsolete master commit $GITHUB_SHA (now $actual)"
          fi

      - name: Publish GitHub Release for this successful current master build
        if: steps.current_head.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<EOF
          Automated Py86 16-bit DOS release **${PY86_VERSION}**.

          - Built from commit \`${GITHUB_SHA}\` on branch \`${GITHUB_REF_NAME}\`.
          - Source: MicroPython **1.29.0** (pinned SHA 0fd6c573ea815774668bbb16b8e197c8822368b2) with Py86 8086 DOS compatibility patches.
          - **1KA**: 1 KB parse-tree arena plus compiler-only Open Watcom flags.
          - **GC root batching**: tested 2-byte overlapping pointer-window traversal, preserving conservative 16-bit far-pointer roots.
          - Near-data layout: far128; GC instrumentation available with PY86_PROFILE=1.
          - Includes standard uncompressed PY86.EXE, generated CLOCK.PY, DEMO.PY and one-screen SHOW.PY.
          - RUNSHOW displays 8 live feature examples within 80x25 DOS screen limits.
          - RUNCLK and RUNTEST launch PY86.EXE directly.
          - RUNCOUNT measures the full -32768..32767 counting loop on DOS.
          - Optional RUNLOAD uses START86 to measure DOS child-launch timing.
          - Original PythonClock sources remain unchanged in the repository.
          - RUNTEST showcases language features, built-in modules and DOS file I/O; it writes PY86.LOG.
          - The packaged executable prints \`Py86 ${PY86_VERSION}\` with \`PY86 --version\`.
          - The full real-mode DOSBox Staging integration suite passed.
          - DOSBox Staging is not a cycle-accurate 8086 or a real Tandy V20 test.

          Extract the versioned ZIP into one directory on your DOS/CF card.
          Run \`PY86 -V\` to check the version and \`RUNCLK\` for PythonClock.
          EOF
          gh release create "$PY86_TAG" "ports/dos16/dist/PY86-${PY86_VERSION}.zip" \
            --title "Py86 ${PY86_VERSION}" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --target "$GITHUB_SHA" --latest

      - name: Verify published release asset matches tested build
        if: steps.current_head.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-verification"
          for attempt in 1 2 3 4 5; do
            if gh release download "$PY86_TAG" \
                 --pattern "PY86-${PY86_VERSION}.zip" \
                 --dir "$RUNNER_TEMP/release-verification"; then
              break
            fi
            sleep $((attempt * 2))
          done
          cmp "ports/dos16/dist/PY86-${PY86_VERSION}.zip" \
              "$RUNNER_TEMP/release-verification/PY86-${PY86_VERSION}.zip"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PY86_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA"
          echo "PASS GitHub release asset and tag match tested master SHA $GITHUB_SHA"

      - name: Permanently delete EVERY older GitHub Release, its assets and its release tag
        if: steps.current_head.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t obsolete < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[].tag_name' | grep -vxF -- "$PY86_TAG" || true
          )
          echo "Deleting ${#obsolete[@]} obsolete GitHub releases and their tags."
          for tag in "${obsolete[@]}"; do
            if [ -z "$tag" ]; then continue; fi
            deleted=false
            for attempt in 1 2 3 4 5; do
              if gh release delete "$tag" --yes --cleanup-tag; then
                deleted=true
                break
              fi
              echo "Retry $attempt deleting release $tag"
              sleep $((attempt * 4))
            done
            if [ "$deleted" != true ]; then
              echo "::error::Could not completely remove release and tag $tag"
              exit 1
            fi
          done
          mapfile -t remaining < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          )
          if [ "${#remaining[@]}" -ne 1 ] || [ "${remaining[0]}" != "$PY86_TAG" ]; then
            printf 'Unexpected releases remaining: %s\n' "${remaining[*]}"
            exit 1
          fi
          for tag in "${obsolete[@]}"; do
            if [ -n "$tag" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Old Git tag $tag still exists"
              exit 1
            fi
          done
          # Git tags can outlive release pages if a previous workflow created
          # a version tag but never successfully published a GitHub Release.
          # Purge those orphaned Py86 v0.* version tags as well.
          mapfile -t version_refs < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0." --jq '.[].ref'
          )
          for ref in "${version_refs[@]}"; do
            case "$ref" in
              "refs/tags/$PY86_TAG") continue ;;
              refs/tags/v0.*)
                echo "Deleting obsolete/orphaned Py86 release tag $ref"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref" >/dev/null
                ;;
              *) echo "Unexpected version ref $ref"; exit 1 ;;
            esac
          done
          mapfile -t version_refs_after < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0." --jq '.[].ref'
          )
          if [ "${#version_refs_after[@]}" -ne 1 ] ||
             [ "${version_refs_after[0]}" != "refs/tags/$PY86_TAG" ]; then
            echo "::error::Obsolete Py86 version tags remain: ${version_refs_after[*]}"
            exit 1
          fi
          echo "PASS: one GitHub release, one associated release tag, and no older release downloads"
          echo "Only release retained: $PY86_TAG" >> "$GITHUB_STEP_SUMMARY"
