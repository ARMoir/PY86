name: Py86 single-segment adaptive heap A/B

# Full fixed-vs-auto A/B profiling is on-demand.
# The normal package push workflow still runs all DOSBox tests and production benchmark.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Exact 48 KB vs automatic heap sizing (same 8086 EXE)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install DOSBox and pinned source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dosbox xvfb xauth
          git clone --quiet --depth 1 --branch v1.24.1 \
            https://github.com/micropython/micropython.git "$RUNNER_TEMP/mp124"
          test "$(git -C "$RUNNER_TEMP/mp124" rev-parse HEAD)" = \
            "ecfdd5d6f9be971852003c2049600dc7b3e2a838"
          python ports/dos16/prepare_source.py --source "$RUNNER_TEMP/mp124"
      - name: Install Open Watcom C16
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/open-watcom/open-watcom-v2/releases/download/2026-11-01-Build/ow-snapshot.tar.xz" \
            --output "$RUNNER_TEMP/ow.tar.xz"
          mkdir -p "$RUNNER_TEMP/ow"
          tar -xJf "$RUNNER_TEMP/ow.tar.xz" -C "$RUNNER_TEMP/ow"
      - name: Build 8086 Py86 once, run DOSBox regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ports/dos16/run_bench.py ports/dos16/compare_heapbench.py
          python ports/dos16/build.py --source "$RUNNER_TEMP/mp124" \
            --watcom "$RUNNER_TEMP/ow"
          xvfb-run -a python ports/dos16/run_dos.py \
            --dosbox "$(command -v dosbox)" --timeout 300
      - name: Measure fixed 48KB and auto heap on identical executable
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python ports/dos16/run_bench.py \
            --dosbox "$(command -v dosbox)" --mode heap-48k --heap 48000 --timeout 240
          xvfb-run -a python ports/dos16/run_bench.py \
            --dosbox "$(command -v dosbox)" --mode heap-auto --heap auto --timeout 240
          python ports/dos16/compare_heapbench.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PY86-adaptive-heap-A-B
          if-no-files-found: warn
          retention-days: 30
          path: |
            ports/dos16/build/benchmark-heap-*.json
            ports/dos16/build/heap-compare.md
            ports/dos16/build/test-results.json
            ports/dos16/build/emulator.log
            ports/dos16/build/bench-emulator.log
