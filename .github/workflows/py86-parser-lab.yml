name: Py86 8086 parser allocator A-B study

# No release or automatic promotion. All candidates use .PY source.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-lab:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare exact MicroPython 1.24.1 and opt-in parser lab
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v1.24.1 \
            https://github.com/micropython/micropython.git "$RUNNER_TEMP/mp124"
          test "$(git -C "$RUNNER_TEMP/mp124" rev-parse HEAD)" = \
            'ecfdd5d6f9be971852003c2049600dc7b3e2a838'
          python ports/dos16/prepare_source.py --source "$RUNNER_TEMP/mp124"
          python ports/dos16/parser_allocator_lab.py patch-source "$RUNNER_TEMP/mp124"
      - name: Install pinned 16-bit Open Watcom
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            'https://github.com/open-watcom/open-watcom-v2/releases/download/2026-11-01-Build/ow-snapshot.tar.xz' \
            --output "$RUNNER_TEMP/ow.tar.xz"
          mkdir -p "$RUNNER_TEMP/ow"
          tar -xJf "$RUNNER_TEMP/ow.tar.xz" -C "$RUNNER_TEMP/ow"
          test -x "$RUNNER_TEMP/ow/binl64/wcc"
      - name: Install pinned DOSBox Staging 0.83.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            'https://github.com/dosbox-staging/dosbox-staging/releases/download/v0.83.0/dosbox-staging-linux-x86_64-v0.83.0.tar.xz' \
            --output "$RUNNER_TEMP/dosbox.tar.xz"
          echo 'd3a94f7f1c3e68a47ec88d61145506c7904452adb0c9c5928cb8cfe2331d6c5c  '"$RUNNER_TEMP/dosbox.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/dosbox"
          tar -xJf "$RUNNER_TEMP/dosbox.tar.xz" -C "$RUNNER_TEMP/dosbox"
          exe="$(find "$RUNNER_TEMP/dosbox" -type f -name dosbox -print -quit)"
          test -x "$exe"
          echo "DOSBOX_STAGING=$exe" >> "$GITHUB_ENV"
      - name: Build and test all source parser allocation strategies
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          python -m py_compile \
            ports/dos16/build.py \
            ports/dos16/parser_allocator_lab.py \
            ports/dos16/run_compile_lab.py \
            ports/dos16/compare_parser_lab.py \
            ports/dos16/package_parser_lab.py
          mkdir -p ports/dos16/build/parser-lab
          for mode in base all p512 p1k p2k geo p1ka p2ka; do
            echo "::group::8086 parser allocator $mode"
            case "$mode" in
              all) set -- --compile-opt all ;;
              p512) set -- --parser-alloc-mode block512 ;;
              p1k) set -- --parser-alloc-mode block1024 ;;
              p2k) set -- --parser-alloc-mode block2048 ;;
              geo) set -- --parser-alloc-mode geometric ;;
              p1ka) set -- --parser-alloc-mode block1024 --compile-opt all ;;
              p2ka) set -- --parser-alloc-mode block2048 --compile-opt all ;;
              *) set -- ;;
            esac
            if ! python ports/dos16/build.py \
              --source "$RUNNER_TEMP/mp124" --watcom "$RUNNER_TEMP/ow" \
              --profile-compile "$@" \
              > "ports/dos16/build/parser-lab/$mode-build.log" 2>&1; then
              echo "::warning::Parser candidate $mode failed compilation"
              tail -n 50 "ports/dos16/build/parser-lab/$mode-build.log"
              echo "$mode: BUILD_FAILED" >> ports/dos16/build/parser-lab/failures.txt
              if [ "$mode" = base ]; then exit 1; fi
              echo "::endgroup::"
              continue
            fi
            cp ports/dos16/build/py86.exe "ports/dos16/build/parser-lab/PY86-$mode.EXE"
            cp ports/dos16/build/py86.map "ports/dos16/build/parser-lab/$mode.map"
            if ! python ports/dos16/run_dos.py \
              --dosbox "$DOSBOX_STAGING" --emulator staging --timeout 360 \
              > "ports/dos16/build/parser-lab/$mode-regress.log" 2>&1; then
              echo "::warning::Parser candidate $mode failed full DOSBox regression"
              tail -n 40 "ports/dos16/build/parser-lab/$mode-regress.log"
              echo "$mode: REGRESSION_FAILED" >> ports/dos16/build/parser-lab/failures.txt
              if [ "$mode" = base ]; then exit 1; fi
              echo "::endgroup::"
              continue
            fi
            cp ports/dos16/build/test-results.json \
              "ports/dos16/build/parser-lab/$mode-test-results.json"
            if ! python ports/dos16/run_compile_lab.py \
              --dosbox "$DOSBOX_STAGING" --emulator staging --timeout 360 \
              --parser-stress --mode "parser-$mode" \
              > "ports/dos16/build/parser-lab/$mode-timing.log" 2>&1; then
              echo "::warning::Parser candidate $mode failed 100-statement stress or timing"
              tail -n 40 "ports/dos16/build/parser-lab/$mode-timing.log"
              echo "$mode: STRESS_OR_PROFILE_FAILED" >> ports/dos16/build/parser-lab/failures.txt
              if [ "$mode" = base ]; then exit 1; fi
              echo "::endgroup::"
              continue
            fi
            cp ports/dos16/dos-test/PDEM1.OUT "ports/dos16/build/parser-lab/$mode-DEMO.OUT"
            cp ports/dos16/dos-test/PSTRES.OUT "ports/dos16/build/parser-lab/$mode-STRESS.OUT"
            cp ports/dos16/dos-test/PCLK.OUT "ports/dos16/build/parser-lab/$mode-CLOCK.OUT"
            echo "PASS all DOSBox tests + source parsing + syntax stress: $mode"
            echo "::endgroup::"
          done
      - name: Compare only verified syntax-tree allocator candidates
        if: always()
        shell: bash
        run: |
          python ports/dos16/compare_parser_lab.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Package real Tandy executable alternatives and test plan
        if: always()
        shell: bash
        run: |
          python ports/dos16/package_parser_lab.py
          unzip -t ports/dos16/dist/PY86-PARSER-LAB.zip
      - name: Retain passing 8086 variants, DOS metrics, maps and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PY86-parser-8086-lab
          if-no-files-found: warn
          retention-days: 30
          path: |
            ports/dos16/build/parser-lab/**
            ports/dos16/build/compile-profile-parser-*.json
            ports/dos16/dist/PY86-PARSER-LAB.zip
