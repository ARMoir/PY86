name: Py86 DOS image size and startup experiments
on:
  push:
    branches: [tandypy-dos16-port]
    paths:
      - 'ports/dos16/build.py'
      - 'ports/dos16/image_size.py'
      - '.github/workflows/py86-size-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: py86-size-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned source and Watcom
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v1.24.1 \
            https://github.com/micropython/micropython.git "$RUNNER_TEMP/micropython-1.24.1"
          test "$(git -C "$RUNNER_TEMP/micropython-1.24.1" rev-parse HEAD)" = 'ecfdd5d6f9be971852003c2049600dc7b3e2a838'
          curl --fail --location --retry 3 \
            'https://github.com/open-watcom/open-watcom-v2/releases/download/2026-11-01-Build/ow-snapshot.tar.xz' \
            --output "$RUNNER_TEMP/ow-snapshot.tar.xz"
          mkdir -p "$RUNNER_TEMP/watcom"
          tar -xJf "$RUNNER_TEMP/ow-snapshot.tar.xz" -C "$RUNNER_TEMP/watcom"
          test -x "$RUNNER_TEMP/watcom/binl64/wcc"
          test -x "$RUNNER_TEMP/watcom/binl64/wlink"
          python ports/dos16/prepare_source.py --source "$RUNNER_TEMP/micropython-1.24.1"

      - name: Download pinned DOSBox Staging
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/dosbox-staging/dosbox-staging/releases/download/v0.83.0/dosbox-staging-linux-x86_64-v0.83.0.tar.xz' \
            --output "$RUNNER_TEMP/dosbox-staging.tar.xz"
          echo 'd3a94f7f1c3e68a47ec88d61145506c7904452adb0c9c5928cb8cfe2331d6c5c  '"$RUNNER_TEMP/dosbox-staging.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/dosbox-staging"
          tar -xJf "$RUNNER_TEMP/dosbox-staging.tar.xz" -C "$RUNNER_TEMP/dosbox-staging"
          exe="$(find "$RUNNER_TEMP/dosbox-staging" -type f -name dosbox -print -quit)"
          test -x "$exe"
          echo "DOSBOX_STAGING=$exe" >> "$GITHUB_ENV"

      - name: Download checksum-verified UPX 5.0.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-amd64_linux.tar.xz' \
            --output "$RUNNER_TEMP/upx.tar.xz"
          echo 'ddc2654063fe4dc80d95b420788494e4db078ebb01a650692d623b5a9906e61e  '"$RUNNER_TEMP/upx.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/upx"
          tar -xJf "$RUNNER_TEMP/upx.tar.xz" -C "$RUNNER_TEMP/upx"
          binary="$(find "$RUNNER_TEMP/upx" -type f -name upx -print -quit)"
          test -x "$binary"
          echo "UPX_EXE=$binary" >> "$GITHUB_ENV"

      - name: Compile baseline executable
        shell: bash
        run: |
          set -euo pipefail
          python ports/dos16/build.py --source "$RUNNER_TEMP/micropython-1.24.1" \
            --watcom "$RUNNER_TEMP/watcom" --image-mode speed
          mkdir -p ports/dos16/build/image-lab
          cp ports/dos16/build/py86.exe ports/dos16/build/image-lab/PY86BASE.EXE
          python ports/dos16/image_size.py speed ports/dos16/build/py86.exe \
            ports/dos16/build/image-lab/speed.json

      - name: DOSBox test baseline executable
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          python ports/dos16/run_dos.py --dosbox "$DOSBOX_STAGING" \
            --emulator staging --timeout 300 > "$RUNNER_TEMP/baseline-test.log"
          cp ports/dos16/build/test-results.json ports/dos16/build/image-lab/speed-test.json
          python ports/dos16/image_size.py startup \
            ports/dos16/build/image-lab/speed-test.json \
            ports/dos16/build/image-lab/speed.json

      - name: Compile small-code candidate without dead-code linker changes
        id: size_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python ports/dos16/build.py --source "$RUNNER_TEMP/micropython-1.24.1" \
            --watcom "$RUNNER_TEMP/watcom" --image-mode size
          cp ports/dos16/build/py86.exe ports/dos16/build/image-lab/PY86SIZE.EXE
          python ports/dos16/image_size.py size ports/dos16/build/py86.exe \
            ports/dos16/build/image-lab/size.json

      - name: DOSBox test small-code executable
        id: size_test
        if: steps.size_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          python ports/dos16/run_dos.py --dosbox "$DOSBOX_STAGING" \
            --emulator staging --timeout 300 | tee ports/dos16/build/image-lab/size-test.log
          cp ports/dos16/build/test-results.json ports/dos16/build/image-lab/size-test.json
          python ports/dos16/image_size.py startup \
            ports/dos16/build/image-lab/size-test.json \
            ports/dos16/build/image-lab/size.json

      - name: Compile compact candidate with dead-code elimination
        id: compact_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python ports/dos16/build.py --source "$RUNNER_TEMP/micropython-1.24.1" \
            --watcom "$RUNNER_TEMP/watcom" --image-mode compact
          cp ports/dos16/build/py86.exe ports/dos16/build/image-lab/PY86COMP.EXE
          python ports/dos16/image_size.py compact ports/dos16/build/py86.exe \
            ports/dos16/build/image-lab/compact.json

      - name: DOSBox test compact executable
        id: compact_test
        if: steps.compact_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          python ports/dos16/run_dos.py --dosbox "$DOSBOX_STAGING" \
            --emulator staging --timeout 300 | tee ports/dos16/build/image-lab/compact-test.log
          cp ports/dos16/build/test-results.json ports/dos16/build/image-lab/compact-test.json
          python ports/dos16/image_size.py startup \
            ports/dos16/build/image-lab/compact-test.json \
            ports/dos16/build/image-lab/compact.json

      - name: Compress baseline with UPX 8086 stub
        id: upx_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$UPX_EXE" --8086 -1 \
            -o ports/dos16/build/image-lab/PY86UPX.EXE \
            ports/dos16/build/image-lab/PY86BASE.EXE
          "$UPX_EXE" -t ports/dos16/build/image-lab/PY86UPX.EXE
          python ports/dos16/image_size.py upx8086 \
            ports/dos16/build/image-lab/PY86UPX.EXE \
            ports/dos16/build/image-lab/upx8086.json

      - name: DOSBox test UPX executable
        id: upx_test
        if: steps.upx_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          cp ports/dos16/build/image-lab/PY86UPX.EXE ports/dos16/build/py86.exe
          python ports/dos16/run_dos.py --dosbox "$DOSBOX_STAGING" \
            --emulator staging --timeout 300 | tee ports/dos16/build/image-lab/upx-test.log
          cp ports/dos16/build/test-results.json ports/dos16/build/image-lab/upx8086-test.json
          python ports/dos16/image_size.py startup \
            ports/dos16/build/image-lab/upx8086-test.json \
            ports/dos16/build/image-lab/upx8086.json

      - name: Display size and startup comparisons
        if: always()
        shell: bash
        run: |
          python ports/dos16/image_size.py summary ports/dos16/build/image-lab || true

      - name: Save verified DOS image candidates and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PY86-size-lab
          path: |
            ports/dos16/build/image-lab/*
            ports/dos16/build/py86.map
            ports/dos16/build/*.log
            ports/dos16/dos-test/DEMO.OUT
            ports/dos16/dos-test/PY86.LOG
            ports/dos16/dos-test/LOADTIME.CSV
          if-no-files-found: warn
          retention-days: 21
