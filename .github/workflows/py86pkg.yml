name: py86pkg host converter checks

on:
  push:
    branches:
      - tandypy-dos16-port
    paths:
      - 'tools/py86pkg/**'
      - '.github/workflows/py86pkg.yml'
  pull_request:
    paths:
      - 'tools/py86pkg/**'
      - '.github/workflows/py86pkg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host converter tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - run: python -m py_compile tools/py86pkg/py86pkg.py
      - run: python -m unittest discover -s tools/py86pkg/tests -v
      - name: Verify editable install CLI
        run: |
          python -m pip install --no-deps -e tools/py86pkg
          py86pkg --help
