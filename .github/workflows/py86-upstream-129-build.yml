name: Py86 v1.29.0 DOS build and diagnostics

on:
  workflow_dispatch:
  push:
    branches: [tandypy-dos16-port]
    paths:
      - .github/workflows/py86-upstream-129-build.yml

permissions:
  contents: read

jobs:
  build-129:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin upstream MicroPython 1.29.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v1.29.0 \
            https://github.com/micropython/micropython.git "$RUNNER_TEMP/mp129"
          test "$(git -C "$RUNNER_TEMP/mp129" rev-parse HEAD)" = \
            '0fd6c573ea815774668bbb16b8e197c8822368b2'
      - name: Rebase 10 C16 compatibility conflicts on 1.29.0, without modifying 1.24.1
        # This is an isolated source checkout and fail-closed rebase.
        shell: bash
        run: |
          python -m py_compile ports/dos16/prepare_source_129.py ports/dos16/rebase_core_129.py
      - name: Adapt old 16-bit compatibility patch, preserve every rejected hunk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ports/dos16/build
          python ports/dos16/prepare_source_129.py \
            --source "$RUNNER_TEMP/mp129" \
            --report-dir ports/dos16/build/mp129-build \
            --allow-rejects | tee ports/dos16/build/mp129-prepare.log
          git -C "$RUNNER_TEMP/mp129" diff --stat \
            > ports/dos16/build/mp129-build/changes.txt
      - name: Install pinned Open Watcom
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            https://github.com/open-watcom/open-watcom-v2/releases/download/2026-11-01-Build/ow-snapshot.tar.xz \
            --output "$RUNNER_TEMP/ow.tar.xz"
          mkdir -p "$RUNNER_TEMP/ow"
          tar -xJf "$RUNNER_TEMP/ow.tar.xz" -C "$RUNNER_TEMP/ow"
      # C16 lexer CRLF retry loop and nested float precision-retry scope.
      - name: Attempt native Open Watcom C16 8086 build
        shell: bash
        run: |
          set +e
          python ports/dos16/build.py --source "$RUNNER_TEMP/mp129" \
            --watcom "$RUNNER_TEMP/ow" --profile-compile \
            --core-version 1.29.0 --parser-alloc-mode original --compile-opt baseline \
            > ports/dos16/build/mp129-build/build.log 2>&1
          result=$?
          echo "RESULT=$result" | tee ports/dos16/build/mp129-build/build-status.txt
          tail -n 100 ports/dos16/build/mp129-build/build.log
          if [ "$result" = 0 ] && [ -f ports/dos16/build/py86.exe ]; then
            cp ports/dos16/build/py86.exe ports/dos16/build/mp129-build/P86V129.EXE
            cp ports/dos16/build/py86.map ports/dos16/build/mp129-build/v129.map
          fi
          exit 0
      - name: Install pinned DOSBox Staging 0.83.0 for native regression
        if: success()
        shell: bash
        run: |
          if [ ! -f ports/dos16/build/mp129-build/P86V129.EXE ]; then exit 0; fi
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            https://github.com/dosbox-staging/dosbox-staging/releases/download/v0.83.0/dosbox-staging-linux-x86_64-v0.83.0.tar.xz \
            --output "$RUNNER_TEMP/dosbox.tar.xz"
          echo 'd3a94f7f1c3e68a47ec88d61145506c7904452adb0c9c5928cb8cfe2331d6c5c  '"$RUNNER_TEMP/dosbox.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/dosbox"
          tar -xJf "$RUNNER_TEMP/dosbox.tar.xz" -C "$RUNNER_TEMP/dosbox"
          exe="$(find "$RUNNER_TEMP/dosbox" -type f -name dosbox -print -quit)"
          test -x "$exe"
          echo "DOSBOX_STAGING=$exe" >> "$GITHUB_ENV"
      - name: Full 8086 DOSBox regression for MicroPython 1.29.0
        if: success()
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          if [ ! -f ports/dos16/build/mp129-build/P86V129.EXE ]; then
            echo 'No 1.29.0 binary generated; cannot validate'
            exit 1
          fi
          python ports/dos16/run_dos.py --dosbox "$DOSBOX_STAGING" \
            --emulator staging --core-version 1.29.0 --timeout 360 \
            > ports/dos16/build/mp129-build/full-dosbox.log 2>&1 || {
              tail -n 100 ports/dos16/build/mp129-build/full-dosbox.log
              exit 1
            }
          cp ports/dos16/build/test-results.json \
            ports/dos16/build/mp129-build/full-dosbox-results.json
          tail -n 50 ports/dos16/build/mp129-build/full-dosbox.log
      - name: Upload patch rejects and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PY86-MicroPython-129-native-build-diagnostics
          if-no-files-found: warn
          retention-days: 30
          path: |
            ports/dos16/build/mp129-build/**
            ports/dos16/build/mp129-prepare.log
