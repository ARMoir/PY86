name: Py86 parser vs compiler runtime and GC profiling

# No release or automatic promotion. All candidates use .PY source.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-lab:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare exact MicroPython 1.24.1 and opt-in parser lab
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v1.24.1 \
            https://github.com/micropython/micropython.git "$RUNNER_TEMP/mp124"
          test "$(git -C "$RUNNER_TEMP/mp124" rev-parse HEAD)" = \
            'ecfdd5d6f9be971852003c2049600dc7b3e2a838'
          python ports/dos16/prepare_source.py --source "$RUNNER_TEMP/mp124"
          python ports/dos16/parser_allocator_lab.py patch-source "$RUNNER_TEMP/mp124"
      - name: Install pinned 16-bit Open Watcom
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            'https://github.com/open-watcom/open-watcom-v2/releases/download/2026-11-01-Build/ow-snapshot.tar.xz' \
            --output "$RUNNER_TEMP/ow.tar.xz"
          mkdir -p "$RUNNER_TEMP/ow"
          tar -xJf "$RUNNER_TEMP/ow.tar.xz" -C "$RUNNER_TEMP/ow"
          test -x "$RUNNER_TEMP/ow/binl64/wcc"
      - name: Install pinned DOSBox Staging 0.83.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            'https://github.com/dosbox-staging/dosbox-staging/releases/download/v0.83.0/dosbox-staging-linux-x86_64-v0.83.0.tar.xz' \
            --output "$RUNNER_TEMP/dosbox.tar.xz"
          echo 'd3a94f7f1c3e68a47ec88d61145506c7904452adb0c9c5928cb8cfe2331d6c5c  '"$RUNNER_TEMP/dosbox.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/dosbox"
          tar -xJf "$RUNNER_TEMP/dosbox.tar.xz" -C "$RUNNER_TEMP/dosbox"
          exe="$(find "$RUNNER_TEMP/dosbox" -type f -name dosbox -print -quit)"
          test -x "$exe"
          echo "DOSBOX_STAGING=$exe" >> "$GITHUB_ENV"
      - name: Isolate parser/compiler flags and optional GC effects on runtime
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          python -m py_compile \
            ports/dos16/build.py \
            ports/dos16/parser_allocator_lab.py \
            ports/dos16/run_compile_lab.py \
            ports/dos16/compare_runtime_gc_lab.py \
            ports/dos16/package_runtime_gc_lab.py
          mkdir -p ports/dos16/build/runtime-lab
          for mode in base all p1k p1ka; do
            echo "::group::8086 parser allocator $mode"
            case "$mode" in
              all) set -- --compile-opt all ;;
              p1k) set -- --parser-alloc-mode block1024 ;;
              p1ka) set -- --parser-alloc-mode block1024 --compile-opt all ;;
              *) set -- ;;
            esac
            if ! python ports/dos16/build.py \
              --source "$RUNNER_TEMP/mp124" --watcom "$RUNNER_TEMP/ow" \
              --runtime-profile "$@" \
              > "ports/dos16/build/runtime-lab/$mode-build.log" 2>&1; then
              echo "::warning::Parser candidate $mode failed compilation"
              tail -n 50 "ports/dos16/build/runtime-lab/$mode-build.log"
              echo "$mode: BUILD_FAILED" >> ports/dos16/build/runtime-lab/failures.txt
              if [ "$mode" = base ]; then exit 1; fi
              echo "::endgroup::"
              continue
            fi
            cp ports/dos16/build/py86.exe "ports/dos16/build/runtime-lab/PY86-$mode.EXE"
            cp ports/dos16/build/py86.map "ports/dos16/build/runtime-lab/$mode.map"
            if ! python ports/dos16/run_dos.py \
              --dosbox "$DOSBOX_STAGING" --emulator staging --timeout 360 \
              > "ports/dos16/build/runtime-lab/$mode-regress.log" 2>&1; then
              echo "::warning::Parser candidate $mode failed full DOSBox regression"
              tail -n 40 "ports/dos16/build/runtime-lab/$mode-regress.log"
              echo "$mode: REGRESSION_FAILED" >> ports/dos16/build/runtime-lab/failures.txt
              if [ "$mode" = base ]; then exit 1; fi
              echo "::endgroup::"
              continue
            fi
            cp ports/dos16/build/test-results.json \
              "ports/dos16/build/runtime-lab/$mode-test-results.json"
            for state in off on; do
              if [ "$state" = on ]; then set -- --preexec-gc; else set --; fi
              if ! python ports/dos16/run_compile_lab.py \
                --dosbox "$DOSBOX_STAGING" --emulator staging --timeout 360 \
                --parser-stress --runtime-stress "$@" \
                --mode "runtime-$mode-$state" \
                > "ports/dos16/build/runtime-lab/$mode-$state-timing.log" 2>&1; then
                echo "$mode-$state: PROFILE_FAILED" >> ports/dos16/build/runtime-lab/failures.txt
                tail -n 60 "ports/dos16/build/runtime-lab/$mode-$state-timing.log"
                exit 1
              fi
              cp ports/dos16/dos-test/PDEM1.OUT \
                "ports/dos16/build/runtime-lab/$mode-$state-DEMO.OUT"
              cp ports/dos16/dos-test/RUNTST.OUT \
                "ports/dos16/build/runtime-lab/$mode-$state-VM.OUT"
              cp ports/dos16/dos-test/PSTRES.OUT \
                "ports/dos16/build/runtime-lab/$mode-$state-PARSER.OUT"
              echo "PASS $mode with forced GC $state"
            done
            echo "::endgroup::"
          done
      - name: Compare validated 2x2 build and forced-GC runs
        if: always()
        shell: bash
        run: |
          python ports/dos16/compare_runtime_gc_lab.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Package four validated DOS binaries and test batches
        if: always()
        shell: bash
        run: |
          python ports/dos16/package_runtime_gc_lab.py
          unzip -t ports/dos16/dist/PY86-RUNTIME-LAB.zip
      - name: Retain passing 8086 variants, DOS metrics, maps and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PY86-runtime-gc-lab
          if-no-files-found: warn
          retention-days: 30
          path: |
            ports/dos16/build/runtime-lab/**
            ports/dos16/build/compile-profile-runtime-*.json
            ports/dos16/dist/PY86-RUNTIME-LAB.zip
