name: Py86 string and GC profiling experiment

on:
  push:
    branches:
      - tandypy-dos16-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: String QSTR cache and GC profile under DOSBox
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DOSBox and headless display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dosbox xvfb xauth
      - name: Get exact pinned MicroPython v1.24.1
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v1.24.1 \
            https://github.com/micropython/micropython.git "$RUNNER_TEMP/mp124"
          test "$(git -C "$RUNNER_TEMP/mp124" rev-parse HEAD)" = \
            "ecfdd5d6f9be971852003c2049600dc7b3e2a838"
          python ports/dos16/prepare_source.py --source "$RUNNER_TEMP/mp124"
      - name: Install pinned Open Watcom C16 compiler
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/open-watcom/open-watcom-v2/releases/download/2026-11-01-Build/ow-snapshot.tar.xz' \
            --output "$RUNNER_TEMP/ow.tar.xz"
          mkdir -p "$RUNNER_TEMP/ow"
          tar -xJf "$RUNNER_TEMP/ow.tar.xz" -C "$RUNNER_TEMP/ow"
      - name: Profile unchanged vs ASCII-cache binaries
        shell: bash
        run: |
          set -euo pipefail
          for mode in original char-cache lazy-hash both; do
            case "$mode" in
              original) label="s-original" ;;
              char-cache) label="s-charcache" ;;
              lazy-hash) label="s-lazyhash" ;;
              both) label="s-both" ;;
            esac
            echo "::group::Benchmark $label"
            python ports/dos16/build.py \
              --source "$RUNNER_TEMP/mp124" \
              --watcom "$RUNNER_TEMP/ow" \
              --lookup-mode map --string-mode "$mode"
            xvfb-run -a python ports/dos16/run_dos.py \
              --dosbox "$(command -v dosbox)" --timeout 300
            xvfb-run -a python ports/dos16/run_bench.py \
              --dosbox "$(command -v dosbox)" --mode "$label" --timeout 240
            xvfb-run -a python ports/dos16/run_strgc.py \
              --dosbox "$(command -v dosbox)" --mode "$label" --timeout 300
            echo "::endgroup::"
          done
      - name: Compare string processing and GC thresholds
        shell: bash
        run: |
          set -euo pipefail
          python ports/dos16/compare_strgc.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload profile and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PY86-string-GC-profile
          if-no-files-found: warn
          retention-days: 30
          path: |
            ports/dos16/build/benchmark-s-*.json
            ports/dos16/build/strgc-s-*.json
            ports/dos16/build/strgc-comparison.md
            ports/dos16/strgc-test/*.OUT
            ports/dos16/build/strgc-emulator.log
            ports/dos16/build/test-results.json
